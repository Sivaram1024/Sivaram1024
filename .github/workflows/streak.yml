name: Generate Streak Stats

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Streak Stats
        run: |
          curl -L \
            "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=default&hide_border=true&type=svg" \
            -o github-streak-stats.svg

      - name: Verify generated file
        run: |
          test -s github-streak-stats.svg
          echo "Streak SVG generated successfully."
          ls -lh github-streak-stats.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-streak-stats.svg
          git diff --cached --quiet || git commit -m "Update GitHub streak stats"
          git push
